# This workflow uses uv for dependency management, testing, and building.
# It maintains parity with the original python-app.yml but leverages uv's speed and caching.

name: Python application via uv

on:
  push:
    branches: [ release/v1 ]
  pull_request:
    branches: [ release/v1 ]
  workflow_dispatch:
    inputs:
      mode:
        description: Prerelease token
        required: true
        default: rc
        type: string

jobs:
  test:
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        os: [Ubuntu, Windows, MacOS]
    steps:
    - uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
    
    - name: Test with tox
      # uv run with --group dev will automatically sync dev dependencies (including tox) and run
      env:
        TOX_PARALLEL_NO_SPINNER: 1
      run: uv run --frozen --group dev tox --parallel
  
  release:
    name: Create release version, publish to PyPI, and create GitHub release
    if: github.repository == 'eyeonus/Trade-Dangerous' && ((github.event_name == 'push' && github.ref == 'refs/heads/release/v1') || github.event_name == 'workflow_dispatch')
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tradedangerous
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
          fetch-depth: 0
          fetch-tags: true
    
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
    
    - name: Install dependencies
      # Installs publish dependencies (python-semantic-release, build)
      # NOTE: Version of Python used determined by ".python-version" file.
      run: uv sync --frozen --group publish
    
    - name: Configure git
      run: |
        git config --global user.name "semantic-release (via GitHub Actions)"
        git config --global user.email "semantic-release@gh"
    
    - name: Semantic Release
      id: release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        before_head="$(git rev-parse HEAD)"
        # Use prerelease mode on manual dispatch; normal version on push
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          uv run semantic-release version --prerelease --as-prerelease --prerelease-token ${{ github.event.inputs.mode }}
        else
          uv run semantic-release version
        fi
        after_head="$(git rev-parse HEAD)"
        after_tag="$(git tag --points-at HEAD)"
        # Only publish if this run created a new release commit and tag
        if [ "$before_head" != "$after_head" ] && [ -n "$after_tag" ]; then
          echo "released=true" >> $GITHUB_OUTPUT
        else
          echo "released=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Build artifacts
      if: steps.release.outputs.released == 'true'
      run: uv build
    
    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      if: steps.release.outputs.released == 'true'
    
    - name: Publish package distributions to GitHub Releases
      if: steps.release.outputs.released == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Use semantic-release to publish to GitHub Releases after the same-job PyPI upload.
      run: uv run semantic-release publish
    
    - name: Build artifacts
      run: uv build
    
    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1