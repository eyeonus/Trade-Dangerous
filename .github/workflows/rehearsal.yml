# This workflow uses uv for dependency management, testing, and optional
# rehearsal builds. It is intentionally side-effect free:
# - no semantic-release versioning
# - no tags
# - no PyPI publish
# - no GitHub release creation
#
# This workflow exists as a safe sandbox for validating workflow changes
# before those changes are rolled into prerelease or stable release flows.

name: Rehearsal via uv

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rehearsal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025, macos-latest]

    steps:
    - uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Test with tox
      env:
        TOX_PARALLEL_NO_SPINNER: 1
      run: uv run --frozen --group dev tox --parallel

  build:
    name: Build rehearsal artifacts
    needs: test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Install publish dependencies
      run: uv sync --frozen --group publish

    - name: Build artifacts
      run: uv build

    - name: Upload rehearsal artifacts
      uses: actions/upload-artifact@v6
      with:
        name: tradedangerous-rehearsal-dist-${{ github.run_number }}
        path: dist/*
        if-no-files-found: error

  windows_installer:
    name: Build Windows installer
    needs: test
    runs-on: windows-2025

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python from repo pin
      uses: actions/setup-python@v5
      with:
        python-version-file: '.python-version'

    - name: Read application version
      id: version
      shell: pwsh
      run: |
        $content = Get-Content -Raw 'tradedangerous/version.py'
        if ($content -match "__version__\s*=\s*['""]([^'""]+)['""]") {
          "version=$($Matches[1])" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        }
        else {
          throw "Could not determine __version__ from tradedangerous/version.py"
        }

    - name: Create freeze virtual environment
      shell: pwsh
      run: |
        python -m venv .venv-freeze
        .\.venv-freeze\Scripts\python.exe -m pip install --upgrade pip
        .\.venv-freeze\Scripts\python.exe -m pip install .
        .\.venv-freeze\Scripts\python.exe -m pip install pyinstaller

    - name: Build frozen GUI bundle
      shell: pwsh
      run: |
        .\.venv-freeze\Scripts\pyinstaller.exe --noconfirm --clean TradeDangerous.spec

    - name: Verify frozen GUI bundle
      shell: pwsh
      run: |
        if (-not (Test-Path 'dist\TradeDangerous\TradeDangerous.exe')) {
          throw 'Frozen GUI bundle was not created at dist\TradeDangerous\TradeDangerous.exe'
        }

    - name: Resolve Inno Setup compiler
      id: iscc
      shell: pwsh
      run: |
        $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
        if ($cmd) {
          "path=$($cmd.Source)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          exit 0
        }

        $candidates = @(
          (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
          (Join-Path ${env:ProgramFiles} 'Inno Setup 6\ISCC.exe')
        ) | Where-Object { $_ -and (Test-Path $_) }

        if ($candidates.Count -eq 0) {
          throw 'ISCC.exe was not found on the runner.'
        }

        "path=$($candidates[0])" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    - name: Build Windows installer
      shell: pwsh
      run: |
        $version = '${{ steps.version.outputs.version }}'
        $iscc = '${{ steps.iscc.outputs.path }}'
        if (-not (Test-Path $iscc)) {
          throw "ISCC.exe not found at $iscc"
        }
        & $iscc "/DTDVersion=$version" '.\TradeDangerous.iss'

    - name: Verify Windows installer
      shell: pwsh
      run: |
        $installer = "Output\TradeDangerous-Setup-${{ steps.version.outputs.version }}.exe"
        if (-not (Test-Path $installer)) {
          throw "Installer was not created at $installer"
        }