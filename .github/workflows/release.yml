# Stable release workflow.
# This workflow is the only automatic publishing path:
# - runs on pushes to the stable release branch
# - runs the test matrix first
# - performs semantic-release versioning only for stable releases
# - publishes to PyPI and GitHub Releases only when a new release was created

name: Stable release publish

on:
  push:
    branches: [release/v1]

permissions:
  contents: read

concurrency:
  group: stable-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Test with tox
      env:
        TOX_PARALLEL_NO_SPINNER: 1
      run: uv run --frozen --group dev tox --parallel

  release:
    name: Create stable release version, publish to PyPI, and create GitHub release
    if: github.repository == 'eyeonus/Trade-Dangerous'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tradedangerous
    permissions:
      id-token: write
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Install publish dependencies
      run: uv sync --frozen --group publish

    - name: Configure git
      run: |
        git config --global user.name "semantic-release (via GitHub Actions)"
        git config --global user.email "semantic-release@gh"

    - name: Create stable release version
      id: release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        before_head="$(git rev-parse HEAD)"
        uv run semantic-release version
        after_head="$(git rev-parse HEAD)"
        after_tag="$(git tag --points-at HEAD)"
        if [ "$before_head" != "$after_head" ] && [ -n "$after_tag" ]; then
          echo "released=true" >> "$GITHUB_OUTPUT"
        else
          echo "released=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Build artifacts
      if: steps.release.outputs.released == 'true'
      run: uv build

    - name: Publish package distributions to PyPI
      if: steps.release.outputs.released == 'true'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        attestations: false

    - name: Publish package distributions to GitHub Releases
      if: steps.release.outputs.released == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: uv run semantic-release publish