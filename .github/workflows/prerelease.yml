name: Manual prerelease publish

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Prerelease channel
        required: true
        default: rc
        type: choice
        options:
          - alpha
          - beta
          - rc
      dry_run:
        description: Rehearse versioning and build without publishing
        required: true
        default: true
        type: boolean
      build_artifacts:
        description: Build and upload distribution artifacts
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: prerelease-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Test with tox
      env:
        TOX_PARALLEL_NO_SPINNER: 1
      run: uv run --frozen --group dev tox --parallel

  rehearse:
    name: Rehearse prerelease
    if: ${{ inputs.dry_run }}
    needs: test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Install publish dependencies
      run: uv sync --frozen --group publish

    - name: Rehearse semantic-release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        uv run semantic-release --noop version \
          --as-prerelease \
          --prerelease-token "${{ inputs.channel }}"

    - name: Build artifacts
      if: ${{ inputs.build_artifacts }}
      run: uv build

    - name: Upload rehearsal artifacts
      if: ${{ inputs.build_artifacts }}
      uses: actions/upload-artifact@v4
      with:
        name: tradedangerous-prerelease-rehearsal-${{ inputs.channel }}-${{ github.run_number }}
        path: dist/*
        if-no-files-found: error

  publish:
    name: Publish prerelease
    if: ${{ !inputs.dry_run }}
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tradedangerous
    permissions:
      id-token: write
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Install publish dependencies
      run: uv sync --frozen --group publish

    - name: Configure git
      run: |
        git config --global user.name "semantic-release (via GitHub Actions)"
        git config --global user.email "semantic-release@gh"

    - name: Create prerelease version
      id: release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        before_head="$(git rev-parse HEAD)"
        uv run semantic-release version \
          --as-prerelease \
          --prerelease-token "${{ inputs.channel }}"
        after_head="$(git rev-parse HEAD)"
        after_tag="$(git tag --points-at HEAD)"
        if [ "$before_head" != "$after_head" ] && [ -n "$after_tag" ]; then
          echo "released=true" >> "$GITHUB_OUTPUT"
        else
          echo "released=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Build artifacts
      if: ${{ steps.release.outputs.released == 'true' && inputs.build_artifacts }}
      run: uv build

    - name: Upload prerelease artifacts
      if: ${{ steps.release.outputs.released == 'true' && inputs.build_artifacts }}
      uses: actions/upload-artifact@v4
      with:
        name: tradedangerous-prerelease-${{ inputs.channel }}-${{ github.run_number }}
        path: dist/*
        if-no-files-found: error

    - name: Publish package distributions to PyPI
      if: ${{ steps.release.outputs.released == 'true' }}
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        attestations: false

    - name: Publish package distributions to GitHub Releases
      if: ${{ steps.release.outputs.released == 'true' }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: uv run semantic-release publish