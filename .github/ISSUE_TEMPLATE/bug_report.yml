# .github/ISSUE_TEMPLATE/bug_report.yml
name: Bug report
description: Report a reproducible problem in the TD V2 fork
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please ensure your Trade Dangerous is up to date with `pip install --upgrade tradedangerous` or you are using the latest version of the Windows installer before submitting a report.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Clear description of the bug and expected behaviour.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Exact steps/commands, dataset, config, and branch if relevant.
      render: markdown
    validations:
      required: true
  - type: dropdown
    id: db
    attributes:
      label: Backend
      options:
        - SQLite
        - MariaDB
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        CLI:
        Please append `-vvvwww` to the original `trade` command and provide the output below.
        For larger logs (20+ lines) please paste the upload to [gist](https://gist.github.com/) and provide a link to the gist here.
        GUI:
        Crash logs can be found in %LOCALAPPDATA%\TradeDangerous\logs. Either quote the contents, or attach the complete file.
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Paste relevant logs, error messages, or tracebacks. Please try to use fenced code blocks.
      render: shell
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Python version, how installed, and any notable config.
