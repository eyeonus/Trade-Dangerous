[database]
backend = sqlite

[mariadb]
host = 127.0.0.1
port = 3306
user = YOUR_USER
password = YOUR_PASS
name = tradedangerous
driver = pymysql

[paths]
data_dir = ./data
tmp_dir  = ./tmp

[engine]
echo = false
connect_timeout = 10
pool_size = 10
max_overflow = 20
pool_timeout = 30
pool_recycle = 1800
isolation_level = READ COMMITTED
